name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "src/mnema/file_provider/**"
      - "tests/e2e/test_ios_file_provider.py"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "scripts/install-uv-macos.sh"
      - "scripts/install-xcodegen-macos.sh"
      - ".github/actions/setup-xcodegen/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "src/mnema/file_provider/**"
      - "tests/e2e/test_ios_file_provider.py"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "scripts/install-uv-macos.sh"
      - "scripts/install-xcodegen-macos.sh"
      - ".github/actions/setup-xcodegen/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload signed archive to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    runs-on: [self-hosted, macOS, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xcodegen
      # actions/setup-python is unusable on a self-hosted macOS runner: it
      # overwrites AGENT_TOOLSDIRECTORY with the GitHub-hosted
      # /Users/runner/hostedtoolcache path, then installs Python with
      # `sudo installer -pkg`, which blocks on a password prompt. uv installs a
      # relocatable Python into the runner account instead, without sudo.
      - name: Provide Python 3.13
        run: |
          uv_prefix="$RUNNER_TEMP/mnema-uv"
          ./scripts/install-uv-macos.sh --prefix "$uv_prefix"
          venv="$RUNNER_TEMP/mnema-venv"
          "$uv_prefix/bin/uv" venv --python 3.13 --seed "$venv"
          printf '%s/bin\n' "$venv" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Select full Xcode installation
        run: |
          xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort | tail -n 1)"
          if [[ -z "$xcode_app" ]]; then
            echo '::error::A full Xcode installation is required on the macOS runner.'
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$xcode_app" >> "$GITHUB_ENV"
          sw_vers
          "$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version
      - working-directory: ios
        run: xcodegen generate
      - name: Verify entitlement build settings
        working-directory: ios
        run: |
          xcodebuild -project Mnema.xcodeproj -target Mnema -showBuildSettings \
            | grep -F 'CODE_SIGN_ENTITLEMENTS = MnemaApp/Mnema.entitlements'
          xcodebuild -project Mnema.xcodeproj -target MnemaFileProvider -showBuildSettings \
            | grep -F 'CODE_SIGN_ENTITLEMENTS = MnemaFileProvider/MnemaFileProvider.entitlements'
          grep -F 'group.com.jparadasb.mnema' MnemaApp/Mnema.entitlements
          grep -F 'group.com.jparadasb.mnema' MnemaFileProvider/MnemaFileProvider.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionFileProviderDocumentGroup' MnemaFileProvider/Info.plist)" = 'group.com.jparadasb.mnema'
      - working-directory: ios
        run: >-
          xcodebuild build
          -project Mnema.xcodeproj
          -scheme Mnema
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/MnemaDerivedData"
          CODE_SIGNING_ALLOWED=NO
      - working-directory: ios
        run: >-
          xcodebuild build
          -project Mnema.xcodeproj
          -scheme Mnema
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/MnemaE2EDerivedData"
      - working-directory: ios
        run: >-
          xcodebuild build
          -project Mnema.xcodeproj
          -scheme MnemaE2EFixture
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/MnemaE2EDerivedData"
      - name: Verify shared Keychain entitlement declarations
        run: |
          /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' \
            ios/MnemaApp/Mnema.entitlements | grep -F 'group.com.jparadasb.mnema'
          /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' \
            ios/MnemaFileProvider/MnemaFileProvider.entitlements | grep -F 'group.com.jparadasb.mnema'
      - name: Install in a temporary simulator
        run: |
          simulator_id="$(xcrun simctl create \
            "Mnema CI $GITHUB_RUN_ID" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-14)"
          cleanup() {
            xcrun simctl shutdown "$simulator_id" >/dev/null 2>&1 || true
            xcrun simctl delete "$simulator_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          app_path="$RUNNER_TEMP/MnemaDerivedData/Build/Products/Debug-iphonesimulator/Mnema.app"
          extension_path="$app_path/PlugIns/MnemaFileProvider.appex"
          plutil -p "$app_path/Info.plist"
          plutil -p "$extension_path/Info.plist"
          if ! xcrun simctl install "$simulator_id" "$app_path"; then
            xcrun simctl spawn "$simulator_id" log show \
              --last 3m \
              --style compact \
              --predicate 'eventMessage CONTAINS[c] "mnema" OR eventMessage CONTAINS[c] "placeholder"' \
              | tail -n 200
            exit 1
          fi
      - name: Install pinned WebDriverAgent test tooling
        env:
          APPIUM_HOME: ${{ runner.temp }}/appium-home
        run: |
          npm ci
          python -m pip install -e '.[dev]'
          npx appium driver install --source=local node_modules/appium-xcuitest-driver
      - name: Run Mnema File Provider simulator E2E
        env:
          APPIUM_HOME: ${{ runner.temp }}/appium-home
          MNEMA_E2E_IOS_APP: ${{ runner.temp }}/MnemaE2EDerivedData/Build/Products/Debug-iphonesimulator/Mnema.app
          MNEMA_E2E_IOS_FIXTURE_APP: ${{ runner.temp }}/MnemaE2EDerivedData/Build/Products/Debug-iphonesimulator/MnemaE2EFixture.app
          MNEMA_IOS_E2E_REQUIRED: "1"
        run: >-
          pytest tests/e2e/test_ios_file_provider.py
          --basetemp="$RUNNER_TEMP/mnema-ios-e2e"
          --no-cov
      - name: Upload simulator E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnema-ios-e2e-diagnostics
          path: ${{ runner.temp }}/mnema-ios-e2e
          if-no-files-found: ignore

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    needs: build
    runs-on: [self-hosted, macOS, X64]
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xcodegen
      - name: Select full Xcode installation
        run: |
          xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort | tail -n 1)"
          if [[ -z "$xcode_app" ]]; then
            echo '::error::A full Xcode installation is required on the macOS runner.'
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$xcode_app" >> "$GITHUB_ENV"
      - working-directory: ios
        run: xcodegen generate
      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          install -d -m 0700 "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 0600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
      - name: Archive and upload
        working-directory: ios
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Mnema.xcodeproj \
            -scheme Mnema \
            -archivePath "$RUNNER_TEMP/Mnema.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mnema.xcarchive" \
            -exportPath "$RUNNER_TEMP/Mnema-export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
