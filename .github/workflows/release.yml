name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, mnema, buildx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - uses: docker/setup-buildx-action@v3
      - name: Validate ARM64 appliance image
        run: docker buildx build --platform linux/arm64 --tag mnema:release-test --load .
      - name: Build release archive
        run: |
          tar -czf mnema-release.tar.gz \
            Dockerfile compose.yaml pyproject.toml README.md LICENSE alembic.ini \
            src migrations scripts docs .github/workflows/ci.yml .github/workflows/release.yml
          sha256sum mnema-release.tar.gz > mnema-release.tar.gz.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          mnema-release.tar.gz
          mnema-release.tar.gz.sha256
          --verify-tag
          --generate-notes
