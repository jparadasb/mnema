name: Set up XcodeGen
description: Install a pinned XcodeGen release without mutating Homebrew
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if command -v xcodegen >/dev/null; then
          exit 0
        fi
        install_prefix="$RUNNER_TEMP/mnema-xcodegen"
        "$GITHUB_ACTION_PATH/../../../scripts/install-xcodegen-macos.sh" \
          --prefix "$install_prefix"
        printf '%s/bin\n' "$install_prefix" >> "$GITHUB_PATH"
