name: Mnema
options:
  bundleIdPrefix: com.jparadasb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  Mnema:
    type: application
    platform: iOS
    sources: [MnemaApp, Shared]
    info:
      path: MnemaApp/Info.plist
    entitlements:
      path: MnemaApp/Mnema.entitlements
    dependencies:
      - target: MnemaFileProvider
  MnemaFileProvider:
    type: app-extension
    platform: iOS
    sources: [MnemaFileProvider, Shared]
    info:
      path: MnemaFileProvider/Info.plist
    entitlements:
      path: MnemaFileProvider/MnemaFileProvider.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jparadasb.mnema.fileprovider
        SKIP_INSTALL: YES
  MnemaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MnemaTests]
    dependencies:
      - target: Mnema
schemes:
  Mnema:
    build:
      targets:
        Mnema: all
        MnemaFileProvider: all
    test:
      targets: [MnemaTests]
