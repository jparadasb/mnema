name: Mnema
options:
  bundleIdPrefix: com.jparadasb
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.7"
    DEVELOPMENT_TEAM: ""
targets:
  Mnema:
    type: application
    platform: iOS
    sources: [MnemaApp, Shared]
    info:
      path: MnemaApp/Info.plist
      properties:
        CFBundleDisplayName: Mnema
        AppGroupIdentifier: group.com.jparadasb.mnema
        KeychainAccessGroup: $(AppIdentifierPrefix)group.com.jparadasb.mnema
        NSLocalNetworkUsageDescription: Mnema connects to your local archive appliance.
        NSFileProviderDomainUsageDescription: Mnema makes your archived files available in the Files app.
        CFBundleURLTypes:
          - CFBundleURLName: com.jparadasb.mnema.pairing
            CFBundleURLSchemes: [mnema]
        UILaunchScreen: {}
    entitlements:
      path: MnemaApp/Mnema.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jparadasb.mnema
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.jparadasb.mnema
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: MnemaApp/Mnema.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.jparadasb.mnema
    dependencies:
      - target: MnemaFileProvider
  MnemaFileProvider:
    type: app-extension
    platform: iOS
    sources: [MnemaFileProvider, MnemaFileProvider/Assets.xcassets, Shared]
    info:
      path: MnemaFileProvider/Info.plist
      properties:
        CFBundleDisplayName: Mnema Files
        AppGroupIdentifier: group.com.jparadasb.mnema
        KeychainAccessGroup: $(AppIdentifierPrefix)group.com.jparadasb.mnema
        NSLocalNetworkUsageDescription: Mnema connects to your local archive appliance.
        NSExtension:
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
    entitlements:
      path: MnemaFileProvider/MnemaFileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jparadasb.mnema
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.jparadasb.mnema
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: MnemaFileProvider/MnemaFileProvider.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.jparadasb.mnema.fileprovider
        SKIP_INSTALL: YES
  MnemaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MnemaTests]
    dependencies:
      - target: Mnema
  MnemaE2EFixture:
    type: application
    platform: iOS
    sources: [MnemaE2EFixture]
    info:
      path: MnemaE2EFixture/Info.plist
      properties:
        CFBundleDisplayName: Mnema E2E Fixture
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jparadasb.mnema.e2e-fixture
schemes:
  Mnema:
    build:
      targets:
        Mnema: all
        MnemaFileProvider: all
    test:
      targets: [MnemaTests]
  MnemaE2EFixture:
    build:
      targets:
        MnemaE2EFixture: all
