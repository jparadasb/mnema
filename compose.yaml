name: mnema
services:
  web:
    build:
      context: .
    image: mnema:0.1.0
    command: ["web", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    env_file: [.env]
    ports: ["${MNEMA_LOCAL_BIND:-127.0.0.1}:8080:8080"]
    volumes:
      - type: bind
        source: ${MNEMA_HOST_CONFIG_ROOT:-./data/config}
        target: /var/lib/mnema
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_ACTIVE_ROOT:-./data/active}
        target: /data/active
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_BACKUP_ROOT:-./data/backup}
        target: /data/backup
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_SOURCE_ROOT:-./data/test-source}
        target: /data/test-source
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      worker:
        condition: service_started
  web-public:
    image: mnema:0.1.0
    profiles: ["cloudflare"]
    command: ["web", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      MNEMA_CLOUDFLARE_ACCESS_REQUIRED: "true"
      MNEMA_SECURE_COOKIES: "1"
    volumes:
      - type: bind
        source: ${MNEMA_HOST_CONFIG_ROOT:-./data/config}
        target: /var/lib/mnema
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_ACTIVE_ROOT:-./data/active}
        target: /data/active
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_BACKUP_ROOT:-./data/backup}
        target: /data/backup
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_SOURCE_ROOT:-./data/test-source}
        target: /data/test-source
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      worker:
        condition: service_started
  file-provider-api:
    image: mnema:0.1.0
    profiles: ["file-provider"]
    command: ["file-provider-api", "--host", "0.0.0.0", "--port", "8082"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/healthz', timeout=3)",
        ]
    restart: unless-stopped
    env_file: [.env]
    ports: ["127.0.0.1:8082:8082"]
    volumes:
      - type: bind
        source: ${MNEMA_HOST_CONFIG_ROOT:-./data/config}
        target: /var/lib/mnema
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_ACTIVE_ROOT:-./data/active}
        target: /data/active
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_BACKUP_ROOT:-./data/backup}
        target: /data/backup
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_SOURCE_ROOT:-./data/test-source}
        target: /data/test-source
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      worker:
        condition: service_started
  worker:
    image: mnema:0.1.0
    command: ["worker"]
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - type: bind
        source: ${MNEMA_HOST_CONFIG_ROOT:-./data/config}
        target: /var/lib/mnema
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_ACTIVE_ROOT:-./data/active}
        target: /data/active
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_BACKUP_ROOT:-./data/backup}
        target: /data/backup
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_SOURCE_ROOT:-./data/test-source}
        target: /data/test-source
        bind: {create_host_path: false}
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
  icloud-runner:
    image: mnema:0.1.0
    profiles: ["icloud"]
    command: ["icloud-status-internal"]
    env_file: [.env]
    volumes:
      - type: bind
        source: ${MNEMA_HOST_CONFIG_ROOT:-./data/config}
        target: /var/lib/mnema
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_ACTIVE_ROOT:-./data/active}
        target: /data/active
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_BACKUP_ROOT:-./data/backup}
        target: /data/backup
        bind: {create_host_path: false}
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_ICLOUD_SESSION_ROOT:-./data/icloud-session}
        target: /var/lib/mnema/icloud-session
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  sftpgo:
    image: drakkan/sftpgo:v2.6.6
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
      - "${MNEMA_SFTP_BIND:-0.0.0.0}:2022:2022"
    volumes:
      - type: bind
        source: ${MNEMA_HOST_SFTPGO_DATA_ROOT:-./data/sftpgo-data}
        target: /var/lib/sftpgo
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_SFTPGO_HOME_ROOT:-./data/sftpgo-home}
        target: /srv/sftpgo
        bind: {create_host_path: false}
      - type: bind
        source: ${MNEMA_HOST_ACTIVE_ROOT:-./data/active}
        target: /srv/mnema-active
        bind: {create_host_path: false}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    user: "10001:10001"
    profiles: ["integration"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - type: bind
        source: ${MNEMA_HOST_MINIO_ROOT:-./data/minio}
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  cloudflared:
    image: cloudflare/cloudflared:2025.7.0
    profiles: ["cloudflare"]
    user: "10001:10001"
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    volumes:
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [web-public]
