[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mnema"
version = "0.1.0"
description = "Your cloud, remembered."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "Mnema contributors"}]
dependencies = [
  "alembic==1.18.5",
  "anyio==4.9.0",
  "boto3==1.39.14",
  "cryptography==45.0.5",
  "fastapi==0.116.1",
  "icloudpd @ https://github.com/icloud-photos-downloader/icloud_photos_downloader/archive/2035bb13ce7d1ac17c70e1e09a7517f474dfd1d9.tar.gz",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyJWT==2.13.0",
  "python-multipart==0.0.20",
  "PyYAML==6.0.2",
  "sqlalchemy==2.0.41",
  "starlette==0.47.3",
  "typer==0.16.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.16.1",
  "pip-licenses==5.0.0",
  "playwright==1.61.0",
  "pre-commit==4.2.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]

[project.scripts]
mnema = "mnema.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mnema"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mnema"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=mnema --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires external executable or service",
  "destructive: deletes temporary test-source data and requires explicit flag",
  "e2e: browser-level test",
]

[tool.coverage.run]
branch = true
source = ["mnema"]
